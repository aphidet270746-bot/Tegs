  .brand-badge{ width:34px; height:34px; border-radius:9px; background:var(--accent); color:var(--surface); display:flex; align-items:center; justify-content:center; font-size:16px; flex:none; }

  .brand p{ margin:0; font-size:.76rem; color:var(--ink-faint); }

  nav.tabs button.active{ background:var(--accent); border-color:var(--accent); color:#fff; }

  .dash-stat .lab{ font-size:.72rem; color:var(--ink-faint); margin-top:2px; }
  .dash-stat.new .num{ color:var(--ink-muted); }
  .dash-stat.learning .num{ color:var(--gold); }
  .dash-stat.known .num{ color:var(--good); }

  .mode-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:8px; }
  .mode-btn{

  .mode-btn .ic{ font-size:1.4rem; }
  .mode-btn .ti{ font-weight:700; font-size:.94rem; }
  .mode-btn .de{ font-size:.78rem; color:var(--ink-faint); }

  .bar-track{ height:7px; background:var(--surface-2); border-radius:999px; overflow:hidden; margin-bottom:16px; }
  .bar-fill{ height:100%; background:var(--accent); border-radius:999px; }

  .choice.correct{ border-color:var(--good); background:var(--good-soft); }
  .choice.correct .lab{ background:var(--good); color:#fff; }
  .choice.wrong{ border-color:var(--bad); background:var(--bad-soft); }
  .choice.wrong .lab{ background:var(--bad); color:#fff; }

  .explain b{ color:var(--ink); }

function getStatus(id){ return STATE.status[id] || "new"; }
function markResult(id, correct){
  var cur = getStatus(id);
  if(correct){
    STATE.status[id] = cur === "known" ? "known" : (cur === "learning" ? "known" : "learning");
  } else {
    STATE.status[id] = "learning";
  }
  saveStatus();
}

/* ---------------- SPEECH ---------------- */

var voices = [];
function loadVoices(){
  voices = (window.speechSynthesis ? speechSynthesis.getVoices() : []).filter(function(v){ return /^en/i.test(v.lang); });
  voices.sort(function(a,b){ return (b.localService?1:0) - (a.localService?1:0); });
}
if("speechSynthesis" in window){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
var AVOID_RE = /\bdavid\b/i;
var FEMALE_VOICE_RE = /\bfemale\b|zira|jenny|aria|susan|samantha|hazel|catherine|michelle|emma|ava|sara|sonia|libby|olivia|natasha|elizabeth|amber|ashley|nancy|cora|maisie/i;
var MALE_VOICE_RE = /\bmale\b|mark|guy|daniel|christopher|eric|ryan|andrew|brian|roger|steffan|jacob|jason|tony|william|davis|brandon|thomas/i;
function pickVoice(){
  if(!voices.length) return null;
  var pool = voices.filter(function(v){ return !AVOID_RE.test(v.name); });
  if(!pool.length) pool = voices.slice();
  var genderRe = STATE.voiceGender === "male" ? MALE_VOICE_RE : FEMALE_VOICE_RE;
  return pool.find(function(v){ return genderRe.test(v.name); }) || pool[0];
}
var speechGen = 0;
var activeUtterance = null;
var keepAliveTimer = null;
function startKeepAlive(){
  stopKeepAlive();
  keepAliveTimer = setInterval(function(){
    if(!("speechSynthesis" in window)) return;
    try{
      if(speechSynthesis.speaking && !speechSynthesis.paused){
        speechSynthesis.pause();
        speechSynthesis.resume();
      }
    }catch(e){}
  }, 9000);
}
function stopKeepAlive(){ if(keepAliveTimer){ clearInterval(keepAliveTimer); keepAliveTimer = null; } }
function speakText(text, rate, onDone){
  if(!("speechSynthesis" in window)){ onDone(); return; }
  if(speechSynthesis.speaking || speechSynthesis.pending) speechSynthesis.cancel();
  var myGen = ++speechGen;
  var u = new SpeechSynthesisUtterance(text);
  var v = pickVoice();
  if(v){ u.voice = v; u.lang = v.lang; } else { u.lang = "en-US"; }
  u.rate = rate || 0.95; u.pitch = 1; u.volume = 1;
  activeUtterance = u;
  startKeepAlive();
  var settled = false;
  function done(){
    if(settled || myGen !== speechGen) return;
    settled = true;
    clearTimeout(watchdog);
    stopKeepAlive();
    activeUtterance = null;
    onDone();
  }
  var watchdog = setTimeout(done, voices.length ? 12000 : 3500);
  u.onend = done;
  u.onerror = done;
  speechSynthesis.speak(u);
}
function stopSpeech(){
  speechGen++;
  stopKeepAlive();
  activeUtterance = null;
  if("speechSynthesis" in window) speechSynthesis.cancel();
}

/* ---------------- HELPERS ---------------- */

function esc(s){ return String(s).replace(/[&<>]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c]; }); }
function shuffle(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function byId(id){ return VOCAB_BANK.find(function(w){ return w.id === id; }); }

function counts(){
  var c = { "new":0, "learning":0, "known":0 };
  VOCAB_BANK.forEach(function(w){ c[getStatus(w.id)]++; });
  return c;
}

function buildQueue(){
  var learning = [], fresh = [], known = [];
  VOCAB_BANK.forEach(function(w){
    var s = getStatus(w.id);
    if(s === "learning") learning.push(w.id);
    else if(s === "new") fresh.push(w.id);
    else known.push(w.id);
  });
  var pool = shuffle(learning).concat(shuffle(fresh)).concat(shuffle(known));
  return pool.slice(0, STATE.sessionSize);
}

function distractorChoices(correctWord, field, n){
  var pool = VOCAB_BANK.filter(function(w){ return w.id !== correctWord.id && w[field] !== correctWord[field]; });
  var picks = shuffle(pool).slice(0, n).map(function(w){ return w[field]; });
  var opts = picks.concat([correctWord[field]]);
  return shuffle(opts);
}

function bindSwipeCard(){
  var card = document.getElementById("swipeCard");
  if(!card) return;
  var tintBad = document.getElementById("swipeTintBad");
  var tintGood = document.getElementById("swipeTintGood");
  var TAP_MAX = 8;
  var SWIPE_MIN = 70;
  var drag = null;

  function setTint(dx){
    var t = Math.min(1, Math.abs(dx) / SWIPE_MIN) * 0.9;
    if(tintBad) tintBad.style.opacity = dx < 0 ? t : 0;
    if(tintGood) tintGood.style.opacity = dx > 0 ? t : 0;
  }
  function reset(){
    card.style.transition = "";
    card.style.transform = "";
    card.style.opacity = "";
    setTint(0);
  }
  function onDown(e){
    if(e.target.closest(".speak-ic")) return;
    drag = { x0:e.clientX, y0:e.clientY, dx:0, dy:0, id:e.pointerId };
    card.style.transition = "none";
    try{ card.setPointerCapture(e.pointerId); }catch(err){}
  }
  function onMove(e){
    if(!drag || drag.id !== e.pointerId) return;
    drag.dx = e.clientX - drag.x0;
    drag.dy = e.clientY - drag.y0;
    card.style.transform = "translateX(" + drag.dx + "px) rotate(" + (drag.dx/18) + "deg)";
    setTint(drag.dx);
  }
  function onUp(e){
    if(!drag || drag.id !== e.pointerId) return;
    var dx = drag.dx, dy = drag.dy;
    drag = null;
    card.style.transition = "transform .25s ease, opacity .25s ease";

    if(Math.abs(dx) < TAP_MAX && Math.abs(dy) < TAP_MAX){
      reset();
      STATE.flipShown = !STATE.flipShown;
      render();
      return;
    }
    if(Math.abs(dx) > SWIPE_MIN && Math.abs(dx) > Math.abs(dy)){
      if(!STATE.flipShown){
        reset();
        STATE.flipShown = true;
        render();
        return;
      }
      var goingRight = dx > 0;
      card.style.transform = "translateX(" + (goingRight?1:-1)*600 + "px) rotate(" + (goingRight?24:-24) + "deg)";
      card.style.opacity = "0";
      var w = byId(STATE.queue[STATE.qIndex]);
      markResult(w.id, goingRight);
      setTimeout(nextItem, 220);
      return;
    }
    reset();
  }
  function onCancel(){ drag = null; reset(); }

  card.addEventListener("pointerdown", onDown);
  card.addEventListener("pointermove", onMove);
  card.addEventListener("pointerup", onUp);
  card.addEventListener("pointercancel", onCancel);
}

  var choices = STATE.choicesCache[qid];
  var selected = STATE.answers[qid];
  var answerIdx = choices.indexOf(w.th);

  var html = '<div class="card"><p class="progress-mini">คำที่ ' + (STATE.qIndex+1) + ' / ' + STATE.queue.length + '</p>';
  html += '<div class="flash" style="padding:20px">';
  html += '<button class="playbtn" data-action="vocab-play" data-qid="' + qid + '">▶</button>';
  html += '<p class="hidden-hint">ฟังคำศัพท์แล้วเลือกความหมายที่ถูกต้อง</p>';
  html += "</div>";
  html += '<div class="choices">';
  choices.forEach(function(c, i){
    var cls = "choice";
    if(selected === i && !locked) cls += " selected";
    if(locked){ if(i === answerIdx) cls += " correct"; else if(i === selected) cls += " wrong"; }
    html += '<button type="button" class="' + cls + '" data-action="vocab-pick" data-qid="' + qid + '" data-idx="' + i + '"' + (locked?" disabled":"") + '><span class="lab">' + String.fromCharCode(65+i) + '</span><span>' + esc(c) + '</span></button>';
  });
  html += "</div>";
  if(locked){
    html += '<div class="explain"><b>' + w.word + '</b> = ' + esc(w.th) + '<br>' + esc(w.ex) + '</div>';
    html += '<div class="btnrow"><button class="btn" data-action="vocab-next">ถัดไป →</button></div>';
  } else {
    html += '<div class="btnrow"><button class="btn" data-action="vocab-submit" data-qid="' + qid + '" ' + (selected===undefined?"disabled":"") + '>ตรวจคำตอบ</button></div>';
  }
  html += "</div>";
  return html;
}

/* ---------------- RENDER: SPEAK (shadowing) ---------------- */

function renderSpeak(){
  if(STATE.qIndex >= STATE.queue.length) return renderSessionDone();
  var w = byId(STATE.queue[STATE.qIndex]);
  var html = '<div class="card"><p class="progress-mini">คำที่ ' + (STATE.qIndex+1) + ' / ' + STATE.queue.length + '</p>';
  html += '<div class="flash">';
  html += '<div class="pos">' + esc(w.pos) + '</div>';
  html += '<div class="word">' + esc(w.word) + '</div>';
  html += '<div class="th">' + esc(w.th) + '</div>';
  html += '<div class="ex">' + esc(w.ex) + '</div>';
  html += '<div class="btnrow"><button class="playbtn" data-action="speak-play">▶</button></div>';
  html += '<p class="hidden-hint">ฟังแล้วพูดตามออกเสียงดัง ๆ ' + STATE.speakRep + '/3 ครั้ง</p>';
  html += '<div class="speak-rep">' + [0,1,2].map(function(i){ return '<span class="' + (i < STATE.speakRep ? "done" : "") + '"></span>'; }).join("") + '</div>';
  html += "</div>";
  html += '<div class="btnrow"><button class="btn ghost" data-action="speak-play">🔁 เล่นอีกครั้ง</button><button class="btn" data-action="vocab-next">ถัดไป →</button></div>';
  html += "</div>";
  return html;
}

/* ---------------- RENDER: READ (fill blank) ---------------- */

function renderRead(){
  if(STATE.qIndex >= STATE.queue.length) return renderSessionDone();
  var qid = STATE.queue[STATE.qIndex];
  var w = byId(qid);
  var locked = !!STATE.locked[qid];
  if(!STATE.choicesCache[qid]) STATE.choicesCache[qid] = distractorChoices(w, "word", 3);
  var choices = STATE.choicesCache[qid];
  var selected = STATE.answers[qid];
  var answerIdx = choices.indexOf(w.word);
  var blanked = w.ex.replace(new RegExp("\\b" + w.word + "\\b", "i"), '<span class="blank">_____</span>');

  var html = '<div class="card"><p class="progress-mini">คำที่ ' + (STATE.qIndex+1) + ' / ' + STATE.queue.length + '</p>';
  html += '<p class="section-intro">เลือกคำที่เติมในช่องว่างให้ถูกต้อง (' + esc(w.th) + ')</p>';
  html += '<p style="font-size:1.05rem;line-height:1.9">' + blanked + '</p>';
  html += '<div class="choices">';
  choices.forEach(function(c, i){
    var cls = "choice";
    if(selected === i && !locked) cls += " selected";
    if(locked){ if(i === answerIdx) cls += " correct"; else if(i === selected) cls += " wrong"; }
    html += '<button type="button" class="' + cls + '" data-action="vocab-pick" data-qid="' + qid + '" data-idx="' + i + '"' + (locked?" disabled":"") + '><span class="lab">' + String.fromCharCode(65+i) + '</span><span>' + esc(c) + '</span></button>';
  });
  html += "</div>";
  if(locked){
    html += '<div class="explain"><b>' + w.word + '</b> = ' + esc(w.th) + '</div>';
    html += '<div class="btnrow"><button class="btn" data-action="vocab-next">ถัดไป →</button></div>';
  } else {
    html += '<div class="btnrow"><button class="btn" data-action="vocab-submit" data-qid="' + qid + '" ' + (selected===undefined?"disabled":"") + '>ตรวจคำตอบ</button></div>';
  }
  html += "</div>";
  return html;
}

/* ---------------- RENDER: WRITE ---------------- */

function renderWrite(){
  if(STATE.qIndex >= STATE.queue.length) return renderSessionDone();
  var w = byId(STATE.queue[STATE.qIndex]);
  var html = '<div class="card"><p class="progress-mini">คำที่ ' + (STATE.qIndex+1) + ' / ' + STATE.queue.length + '</p>';
  html += '<div class="flash">';
  html += '<div class="pos">' + esc(w.pos) + '</div>';
  html += '<div class="th" style="font-size:1.3rem">' + esc(w.th) + '</div>';
  html += '<div class="ex">' + esc(w.ex.replace(new RegExp("\\b" + w.word + "\\b", "i"), "_____")) + '</div>';
  html += "</div>";
  var inputCls = "write-input" + (STATE.writeChecked ? (STATE.writeCorrect ? " correct" : " wrong") : "");
  html += '<input type="text" class="' + inputCls + '" id="writeBox" placeholder="พิมพ์คำศัพท์ภาษาอังกฤษ" value="' + esc(STATE.writeInput) + '" ' + (STATE.writeChecked ? "disabled" : "") + ' autocomplete="off" spellcheck="false">';
  if(STATE.writeChecked){
    html += '<div class="explain" style="text-align:center"><b>เฉลย:</b> ' + esc(w.word) + '</div>';
    html += '<div class="btnrow"><button class="btn" data-action="vocab-next">ถัดไป →</button></div>';
  } else {
    html += '<div class="btnrow"><button class="btn" data-action="write-check" data-word="' + esc(w.word) + '">ตรวจคำตอบ</button></div>';
  }
  html += "</div>";
  return html;
}

function renderSessionDone(){
  var c = counts();
  return '<div class="card"><h3>จบรอบนี้แล้ว 🎉</h3><p class="section-intro">จำได้แล้ว ' + c.known + ' / ' + VOCAB_BANK.length + ' คำ (รวมทุกโหมด)</p>'
    + '<div class="btnrow"><button class="btn" data-action="start-mode" data-mode="' + STATE.mode + '">ฝึกรอบใหม่ (โหมดเดิม)</button><button class="btn ghost" data-action="goto-dashboard">กลับหน้าหลัก</button></div></div>';
}

/* ---------------- MAIN RENDER ---------------- */

var MODE_LABELS = { dashboard:"ภาพรวม", browse:"ทบทวน", listen:"ฟัง", speak:"พูดตาม", read:"อ่าน", write:"เขียน" };
function render(){
  var tabs = document.getElementById("tabs");
  tabs.innerHTML = Object.keys(MODE_LABELS).map(function(m){
    return '<button data-action="goto-mode" data-mode="' + m + '" class="' + (STATE.mode===m?"active":"") + '">' + MODE_LABELS[m] + "</button>";
  }).join("");

  var stage = document.getElementById("stage");
  if(STATE.mode === "dashboard") stage.innerHTML = renderDashboard();
  else if(STATE.mode === "browse") stage.innerHTML = renderBrowse();
  else if(STATE.mode === "listen") stage.innerHTML = renderListen();
  else if(STATE.mode === "speak") stage.innerHTML = renderSpeak();
  else if(STATE.mode === "read") stage.innerHTML = renderRead();
  else if(STATE.mode === "write") stage.innerHTML = renderWrite();

  if(STATE.mode === "write" && !STATE.writeChecked){
    var box = document.getElementById("writeBox");
    if(box) box.focus();
  }
  if(STATE.mode === "browse") bindSwipeCard();
}

/* ---------------- ACTIONS ---------------- */

function startMode(mode){
  stopSpeech();
  STATE.mode = mode;
  STATE.queue = buildQueue();
  STATE.qIndex = 0;
  STATE.flipShown = false;
  STATE.answers = {}; STATE.locked = {}; STATE.choicesCache = {};
  STATE.writeChecked = false; STATE.writeCorrect = null; STATE.writeInput = "";
  STATE.speakRep = 0;
  render();
}

function nextItem(){
  stopSpeech();
  STATE.qIndex++;
  STATE.flipShown = false;
  STATE.writeChecked = false; STATE.writeCorrect = null; STATE.writeInput = "";
  STATE.speakRep = 0;
  render();
}

document.addEventListener("click", function(e){
  var t = e.target.closest("[data-action]");
  if(!t) return;
  var action = t.getAttribute("data-action");

  if(action === "start-mode"){ startMode(t.getAttribute("data-mode")); return; }
  if(action === "goto-mode"){
    var m = t.getAttribute("data-mode");
    if(m === "dashboard"){ stopSpeech(); STATE.mode = "dashboard"; render(); }
    else startMode(m);
    return;
  }
  if(action === "goto-dashboard"){ stopSpeech(); STATE.mode = "dashboard"; render(); return; }

  if(action === "reset-progress"){
    STATE.status = {}; saveStatus(); render(); return;
  }

  if(action === "browse-play"){
    var wPlay = byId(STATE.queue[STATE.qIndex]);
    speakText(STATE.flipShown ? (wPlay.word + ". " + wPlay.ex) : wPlay.word, 0.92, function(){});
    return;
  }
  if(action === "set-voice-gender"){
    var gender = t.getAttribute("data-gender");
    if(gender === "male" || gender === "female"){
      STATE.voiceGender = gender;
      saveVoiceGender();
      renderVoiceToggle();
    }
    return;
  }

  if(action === "vocab-play"){
    var qid1 = t.getAttribute("data-qid");
    var w1 = byId(qid1);
    speakText(w1.word + ". " + w1.ex, 0.92, function(){});
    return;
  }
  if(action === "speak-play"){
    var w2 = byId(STATE.queue[STATE.qIndex]);
    speakText(w2.word + ". " + w2.ex, 0.85, function(){
      STATE.speakRep = Math.min(3, STATE.speakRep+1);
      render();
    });
    return;
  }

  if(action === "vocab-pick"){
    var qid2 = t.getAttribute("data-qid");
    if(STATE.locked[qid2]) return;
    STATE.answers[qid2] = parseInt(t.getAttribute("data-idx"),10);
    render();
    return;
  }
  if(action === "vocab-submit"){
    var qid3 = t.getAttribute("data-qid");
    if(STATE.answers[qid3] === undefined) return;
    STATE.locked[qid3] = true;
    var w3 = byId(qid3);
    var field = STATE.mode === "read" ? "word" : "th";
    var choices3 = STATE.choicesCache[qid3];
    var correct = choices3[STATE.answers[qid3]] === w3[field];
    markResult(w3.id, correct);
    render();
    return;
  }
  if(action === "vocab-next"){ nextItem(); return; }

  if(action === "write-check"){
    var box2 = document.getElementById("writeBox");
    var val = box2 ? box2.value.trim().toLowerCase() : "";
    if(!val) return;
    var target = t.getAttribute("data-word").toLowerCase();
    var ok = val === target;
    var w4 = byId(STATE.queue[STATE.qIndex]);
    markResult(w4.id, ok);
    STATE.writeInput = box2.value;
    STATE.writeChecked = true;
    STATE.writeCorrect = ok;
    render();
    return;
  }
});

document.addEventListener("keydown", function(e){
  if(e.key === "Enter" && STATE.mode === "write" && !STATE.writeChecked){
    var box = document.getElementById("writeBox");
    if(document.activeElement === box && box.value.trim()){
      var w = byId(STATE.queue[STATE.qIndex]);
      var ok = box.value.trim().toLowerCase() === w.word.toLowerCase();
      markResult(w.id, ok);
      STATE.writeInput = box.value;
      STATE.writeChecked = true;
      STATE.writeCorrect = ok;
      render();
    }
    return;
  }
  if(STATE.mode === "browse" && STATE.qIndex < STATE.queue.length){
    if(e.key === " " || e.key === "Enter"){
      e.preventDefault();
      STATE.flipShown = !STATE.flipShown;
      render();
    } else if(e.key === "ArrowLeft" || e.key === "ArrowRight"){
      e.preventDefault();
      if(!STATE.flipShown){
        STATE.flipShown = true;
        render();
      } else {
        var wKey = byId(STATE.queue[STATE.qIndex]);
        markResult(wKey.id, e.key === "ArrowRight");
        nextItem();
      }
    }
  }
});

loadStatus();
loadVoiceGender();
renderVoiceToggle();
render();
})();
</script>
