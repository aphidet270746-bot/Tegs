<title>ห้องซ้อมสอบ TEGS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --bg:#f6f5f1; --surface:#ffffff; --surface-2:#eef0ec;
    --ink:#20232a; --ink-muted:#5b5f6b; --ink-faint:#8a8e97;
    --accent:#2f5d62; --accent-ink:#1d3b3f; --accent-soft:#dcebea;
    --good:#2e7d4f; --good-soft:#e3f3e9;
    --bad:#b3432f; --bad-soft:#fbe6df;
    --rule:#e3e1d9;
    --shadow:0 1px 2px rgba(30,30,20,.05), 0 8px 24px rgba(30,30,20,.06);
    --radius:14px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#13161a; --surface:#1a1e23; --surface-2:#20252b;
      --ink:#e9eae6; --ink-muted:#a3a8ae; --ink-faint:#767c84;
      --accent:#7fc4c0; --accent-ink:#bfe6e3; --accent-soft:#1f3a3a;
      --good:#5fbf86; --good-soft:#12331f;
      --bad:#e8a688; --bad-soft:#3a2620;
      --rule:#2a2e33;
      --shadow:0 1px 2px rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"]{
    --bg:#13161a; --surface:#1a1e23; --surface-2:#20252b;
    --ink:#e9eae6; --ink-muted:#a3a8ae; --ink-faint:#767c84;
    --accent:#7fc4c0; --accent-ink:#bfe6e3; --accent-soft:#1f3a3a;
    --good:#5fbf86; --good-soft:#12331f;
    --bad:#e8a688; --bad-soft:#3a2620;
    --rule:#2a2e33;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.4);
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Sarabun","IBM Plex Sans Thai","Noto Sans Thai","Leelawadee UI",-apple-system,"Segoe UI",system-ui,sans-serif;
    line-height:1.6;
  }
  .mono{ font-family:ui-monospace,"Cascadia Code","SF Mono",Consolas,monospace; font-variant-numeric:tabular-nums; }
  button{ font-family:inherit; }
  h1,h2,h3{ text-wrap:balance; margin:0; }
  a{ color:var(--accent); }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  .wrap{ max-width:840px; margin:0 auto; padding:0 20px 90px; }

  header.top{
    position:sticky; top:0; z-index:10;
    background:var(--bg);
    border-bottom:1px solid var(--rule);
    padding:16px 0 0;
  }
  .top-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; padding-bottom:14px; }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand-badge{
    width:34px; height:34px; border-radius:9px; background:var(--accent);
    color:var(--surface); display:flex; align-items:center; justify-content:center;
    font-size:16px; flex:none;
  }
  .brand h1{ font-size:1.08rem; }
  .brand p{ margin:0; font-size:.76rem; color:var(--ink-faint); }

  .mode-toggle{ display:flex; background:var(--surface-2); border-radius:10px; padding:3px; gap:2px; }
  .mode-toggle button{
    border:none; background:transparent; padding:7px 12px; border-radius:8px;
    font-size:.82rem; color:var(--ink-muted); cursor:pointer;
  }
  .mode-toggle button.active{ background:var(--surface); color:var(--accent-ink); box-shadow:var(--shadow); font-weight:600; }

  .set-switch{ display:flex; gap:6px; padding:10px 0 6px; flex-wrap:wrap; }
  .set-switch button{
    border:1px solid var(--rule); background:var(--surface); color:var(--ink-muted);
    border-radius:8px; padding:6px 12px; font-size:.8rem; cursor:pointer;
  }
  .set-switch button.active{ background:var(--accent-ink); border-color:var(--accent-ink); color:#fff; font-weight:600; }

  nav.tabs{ display:flex; gap:4px; overflow-x:auto; padding-bottom:10px; }
  nav.tabs button{
    border:1px solid var(--rule); background:var(--surface); color:var(--ink-muted);
    border-radius:999px; padding:7px 14px; font-size:.82rem; white-space:nowrap; cursor:pointer;
    display:flex; align-items:center; gap:6px;
  }
  nav.tabs button.active{ background:var(--accent); border-color:var(--accent); color:#fff; }
  nav.tabs button .cnt{ font-size:.7rem; opacity:.8; }

  main{ padding-top:26px; }

  .card{
    background:var(--surface); border:1px solid var(--rule); border-radius:var(--radius);
    padding:22px 24px; margin-bottom:16px; box-shadow:var(--shadow);
  }
  .section-intro{ color:var(--ink-muted); font-size:.92rem; margin:0 0 18px; }
  .section-intro b{ color:var(--ink); }

  .timerbar{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--accent-soft); color:var(--accent-ink);
    border-radius:12px; padding:10px 16px; margin-bottom:18px; font-size:.86rem;
  }
  .timerbar.urgent{ background:var(--bad-soft); color:var(--bad); }
  .timerbar .t{ font-size:1.1rem; font-weight:700; }

  /* listening player */
  .player{
    display:flex; flex-direction:column; align-items:center; text-align:center;
    padding:30px 20px;
  }
  .eq{ display:flex; align-items:flex-end; gap:4px; height:44px; margin-bottom:16px; }
  .eq span{ width:5px; background:var(--accent); border-radius:3px; height:8px; opacity:.35; }
  .eq.live span{ animation:bounce 900ms ease-in-out infinite; opacity:1; }
  .eq span:nth-child(1){ animation-delay:0ms; } .eq span:nth-child(2){ animation-delay:120ms; }
  .eq span:nth-child(3){ animation-delay:240ms; } .eq span:nth-child(4){ animation-delay:360ms; }
  .eq span:nth-child(5){ animation-delay:480ms; } .eq span:nth-child(6){ animation-delay:600ms; }
  .eq span:nth-child(7){ animation-delay:720ms; }
  @keyframes bounce{ 0%,100%{ height:8px; } 50%{ height:40px; } }
  @media (prefers-reduced-motion:reduce){ .eq.live span{ animation:none; height:24px; opacity:.8; } }

  .playbtn{
    border:none; background:var(--accent); color:#fff; border-radius:999px;
    width:64px; height:64px; font-size:22px; cursor:pointer; box-shadow:var(--shadow);
  }
  .playbtn:disabled{ opacity:.5; cursor:default; }
  .player-label{ margin-top:12px; font-size:.86rem; color:var(--ink-muted); }
  .replay{
    margin-top:10px; border:1px solid var(--rule); background:var(--surface); color:var(--ink-muted);
    padding:6px 14px; border-radius:999px; font-size:.8rem; cursor:pointer;
  }

  .qprompt{ font-size:1rem; margin:6px 0 14px; }
  .choices{ display:flex; flex-direction:column; gap:8px; }
  .choice{
    display:flex; gap:10px; align-items:flex-start; text-align:left;
    border:1px solid var(--rule); background:var(--surface); border-radius:10px;
    padding:11px 14px; cursor:pointer; font-size:.94rem; color:var(--ink);
  }
  .choice .lab{
    flex:none; width:22px; height:22px; border-radius:6px; background:var(--surface-2);
    color:var(--ink-muted); font-size:.75rem; display:flex; align-items:center; justify-content:center; font-weight:700;
  }
  .choice.selected{ border-color:var(--accent); background:var(--accent-soft); }
  .choice.selected .lab{ background:var(--accent); color:#fff; }
  .choice.correct{ border-color:var(--good); background:var(--good-soft); }
  .choice.correct .lab{ background:var(--good); color:#fff; }
  .choice.wrong{ border-color:var(--bad); background:var(--bad-soft); }
  .choice.wrong .lab{ background:var(--bad); color:#fff; }
  .choice:disabled, .choice[data-locked="1"]{ cursor:default; }

  .explain{
    margin-top:10px; font-size:.86rem; color:var(--ink-muted);
    background:var(--surface-2); border-radius:10px; padding:10px 14px;
  }
  .explain b{ color:var(--ink); }

  .btnrow{ display:flex; gap:10px; margin-top:16px; flex-wrap:wrap; }
  .btn{
    border:none; border-radius:10px; padding:10px 18px; font-size:.88rem; cursor:pointer;
    background:var(--accent); color:#fff; font-weight:600;
  }
  .btn.ghost{ background:var(--surface-2); color:var(--ink); }
  .btn:disabled{ opacity:.45; cursor:default; }
  .transcript-toggle{
    background:none; border:1px dashed var(--rule); color:var(--ink-faint); border-radius:8px;
    padding:6px 12px; font-size:.78rem; cursor:pointer; margin-top:10px;
  }
  .transcript{
    margin-top:8px; font-size:.86rem; color:var(--ink-muted); background:var(--surface-2);
    border-radius:10px; padding:10px 14px;
  }
  .transcript p{ margin:4px 0; }
  .transcript b{ color:var(--accent-ink); }

  /* error segments */
  .sentence{ font-size:1.02rem; line-height:2.1; }
  .seg{
    border:none; background:none; cursor:pointer; font:inherit; color:var(--ink);
    border-bottom:2px dashed var(--ink-faint); padding:1px 2px; position:relative;
  }
  .seg sup{ color:var(--accent); font-weight:700; margin-left:2px; }
  .seg.selected{ background:var(--accent-soft); border-bottom-color:var(--accent); border-radius:4px; }
  .seg.correct{ background:var(--good-soft); border-bottom-color:var(--good); border-radius:4px; }
  .seg.wrong{ background:var(--bad-soft); border-bottom-color:var(--bad); border-radius:4px; }
  .seg:disabled{ cursor:default; }

  .passage{
    font-size:.94rem; color:var(--ink-muted); background:var(--surface-2);
    border-radius:10px; padding:14px 16px; margin-bottom:18px; line-height:1.85;
  }
  .blankmark{
    display:inline-flex; align-items:center; justify-content:center;
    min-width:22px; height:20px; padding:0 4px; border-radius:6px;
    background:var(--accent-soft); color:var(--accent-ink); font-size:.72rem; font-weight:700;
    margin:0 2px;
  }
  .qgroup-title{ font-size:.78rem; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint); margin:0 0 6px; }

  .progress-mini{ font-size:.78rem; color:var(--ink-faint); margin-bottom:14px; }

  /* results */
  .score-hero{ text-align:center; padding:34px 20px; }
  .score-hero .big{ font-size:3rem; font-weight:800; color:var(--accent-ink); }
  .score-hero .big span{ font-size:1.4rem; color:var(--ink-faint); font-weight:600; }
  .bars{ display:flex; flex-direction:column; gap:12px; margin-top:8px; }
  .bar-row{ display:grid; grid-template-columns:110px 1fr 60px; align-items:center; gap:10px; font-size:.86rem; }
  .bar-track{ height:9px; background:var(--surface-2); border-radius:999px; overflow:hidden; }
  .bar-fill{ height:100%; background:var(--accent); border-radius:999px; }
  .review-item{ border-top:1px solid var(--rule); padding:12px 0; font-size:.88rem; }
  .review-item:first-child{ border-top:none; }
  .review-tag{ font-size:.7rem; text-transform:uppercase; color:var(--ink-faint); letter-spacing:.05em; }
  .pill-good{ color:var(--good); font-weight:700; }
  .pill-bad{ color:var(--bad); font-weight:700; }

  .notice{
    background:var(--bad-soft); color:var(--bad); border-radius:10px; padding:10px 14px; font-size:.85rem; margin-bottom:16px;
  }

  footer.foot{ text-align:center; color:var(--ink-faint); font-size:.8rem; padding:30px 0 0; }

  @media (max-width:560px){
    .bar-row{ grid-template-columns:84px 1fr 44px; font-size:.78rem; }
  }
</style>

<div class="wrap">
  <header class="top">
    <div class="top-row">
      <div class="brand">
        <div class="brand-badge">🎧</div>
        <div>
          <h1>ห้องซ้อมสอบ TEGS</h1>

</div>

var DEBUG = { voicesCount:0 };

var voices = [];
function loadVoices(){
  voices = (window.speechSynthesis ? speechSynthesis.getVoices() : []).filter(function(v){ return /^en/i.test(v.lang); });
  voices.sort(function(a,b){ return (b.localService?1:0) - (a.localService?1:0); });
  DEBUG.voicesCount = voices.length;
}
if("speechSynthesis" in window){
  loadVoices();
  speechSynthesis.onvoiceschanged = loadVoices;
}
var VOICE_AVOID_RE = /david/i;
var VOICE_RANK_A_RE = /zira|jenny|aria|susan|samantha|hazel|catherine|michelle|emma|ava|sara|sonia|libby|olivia|natasha|elizabeth|amber|ashley|nancy|cora|maisie/i;
var VOICE_RANK_B_RE = /mark|guy|daniel|christopher|eric|ryan|andrew|brian|roger|steffan|jacob|jason|tony|william|davis|brandon|thomas/i;
function pickVoice(spk){
  if(!voices.length) return null;
  var pool = voices.filter(function(v){ return !VOICE_AVOID_RE.test(v.name); });
  if(!pool.length) pool = voices.slice();
  pool = pool.slice().sort(function(x, y){
    var xq = /natural|neural|online/i.test(x.name) ? 0 : 1;
    var yq = /natural|neural|online/i.test(y.name) ? 0 : 1;
    return xq - yq;
  });
  var a = pool.find(function(v){ return VOICE_RANK_A_RE.test(v.name); }) || pool[0];
  var b = pool.find(function(v){ return VOICE_RANK_B_RE.test(v.name) && v !== a; });
  if(!b) b = pool.find(function(v){ return v !== a; }) || a;
  return spk === "M" ? a : b;
}
var speaking = false;
var speechGen = 0;
var activeUtterances = [];
var keepAliveTimer = null;

function startKeepAlive(){
  stopKeepAlive();
  keepAliveTimer = setInterval(function(){
    if(!("speechSynthesis" in window)) return;
    try{
      if(speechSynthesis.speaking && !speechSynthesis.paused){
        speechSynthesis.pause();
        speechSynthesis.resume();
      }
    }catch(e){}
  }, 9000);
}
function stopKeepAlive(){ if(keepAliveTimer){ clearInterval(keepAliveTimer); keepAliveTimer = null; } }

function speakLines(lines, onDone){
  if(!("speechSynthesis" in window)){ onDone(); return; }
  if(speechSynthesis.speaking || speechSynthesis.pending) speechSynthesis.cancel();
  var myGen = ++speechGen;
  speaking = true;
  activeUtterances = [];
  startKeepAlive();

  var remaining = lines.length;
  var finished = false;
  function finish(){
    if(finished || myGen !== speechGen) return;
    finished = true;
    speaking = false;
    stopKeepAlive();
    activeUtterances = [];
    onDone();
  }
  function settleOne(){
    if(myGen !== speechGen) return;
    remaining--;
    if(remaining <= 0) finish();
  }

  if(!lines.length){ finish(); return; }

  lines.forEach(function(line){
    var u = new SpeechSynthesisUtterance(line.text);
    u.rate = 0.96; u.pitch = (line.spk === "M" ? 1.35 : 1.02); u.volume = 1;
    var v = pickVoice(line.spk);
    if(v){ u.voice = v; u.lang = v.lang; } else { u.lang = "en-US"; }
    var settled = false;
    u.onend = function(){ if(settled) return; settled = true; settleOne(); };
    u.onerror = function(){ if(settled) return; settled = true; settleOne(); };
    activeUtterances.push(u);
    speechSynthesis.speak(u);
  });

  var perLineMs = voices.length ? 9000 : 4000;
  setTimeout(function(){ finish(); }, lines.length * perLineMs);
}
function stopSpeech(){
  speechGen++;
  stopKeepAlive();
  activeUtterances = [];
  if("speechSynthesis" in window) speechSynthesis.cancel();
  speaking = false;
}

}
function esc(s){ return String(s).replace(/[&<>]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c]; }); }

      item.data.questions.forEach(function(qq, i){
        var qid = "listen-" + item.data.id + "-" + i;
        html += '<div style="margin-top:' + (i? '18px':'0') + '"><p class="qgroup-title">คำถามที่ ' + (i+1) + '/' + item.data.questions.length + '</p>';
        html += renderMCQ(qid, esc(qq.q), qq.choices, qq.answer, qq.explain, {});
        html += "</div>";
      });
    }
    var allLocked = item.type === "dialog"
      ? STATE.locked["listen-"+item.data.id]
      : item.data.questions.every(function(_,i){ return STATE.locked["listen-"+item.data.id+"-"+i]; });

    if(STATE.mode === "practice"){
      html += '<div class="btnrow"><button class="btn ghost" data-action="listen-next" ' + (allLocked?'':'disabled') + '>ข้อถัดไป →</button></div>';
      if(allLocked && !noTTS){
        html += transcriptBlock(item, false);
      }
    }
  }

  html += "</div>";
  return html;
}

function transcriptBlock(item, forceOpen){
  var id = "t-" + item.data.id;
  var shown = forceOpen || STATE.showTranscript[id];
  var html = "";
  if(!forceOpen){
    html += '<button class="transcript-toggle" data-action="toggle-transcript" data-tid="' + id + '">' + (shown?"ซ่อนบทสนทนา":"👁 ดูบทสนทนา (Transcript)") + '</button>';
  }
  if(shown){
    html += '<div class="transcript">';
    item.data.lines.forEach(function(l){
      html += '<p><b>' + (l.spk==="M"?"Man":l.spk==="W"?"Woman":"Speaker") + ':</b> ' + esc(l.text) + '</p>';
    });
    html += "</div>";
  }
  return html;
}

function renderListenDone(){
  var total = LISTEN_ITEMS.reduce(function(n,it){ return n + (it.type==="dialog"?1:it.data.questions.length); }, 0);
  var correct = 0;
  LISTEN_ITEMS.forEach(function(it){
    if(it.type==="dialog"){ var qid="listen-"+it.data.id; if(STATE.answers[qid]===it.data.answer) correct++; }
    else { it.data.questions.forEach(function(qq,i){ var qid="listen-"+it.data.id+"-"+i; if(STATE.answers[qid]===qq.answer) correct++; }); }
  });
  return '<div class="card"><h3>จบส่วน Listening แล้ว 🎧</h3><p class="section-intro">ทำถูก <b>' + correct + ' / ' + total + '</b> ข้อ</p>'
    + '<div class="btnrow"><button class="btn" data-action="goto-section" data-section="error">ไปทำ Structure ต่อ →</button> <button class="btn ghost" data-action="listen-restart">เริ่ม Listening ใหม่</button></div></div>';
}

function startListenPlay(){
  var st = STATE.listen;
  var item = LISTEN_ITEMS[st.idx];
  st.phase = "playing";
  st.autoplayBlocked = false;
  render();
  var started = false;
  var fallbackTimer = setTimeout(function(){
    if(!started && !speaking){
      st.autoplayBlocked = true;
      render();
    }
  }, 1800);
  speakLines(item.data.lines, function(){
    started = true;
    clearTimeout(fallbackTimer);
    st.autoplayBlocked = false;
    st.phase = "answering";
    if(STATE.mode === "exam"){
      var secs = item.type === "monolog" ? 60 : 15;
      st.timeLeft = secs;
      clearListenTimer();
      st.timerId = setInterval(function(){
        st.timeLeft--;
        if(st.timeLeft <= 0){
          clearListenTimer();
          autoLockCurrentListen();
          advanceListen();
          return;
        }
        render();
      }, 1000);
    }
    render();
  });
}

function autoLockCurrentListen(){
  var item = LISTEN_ITEMS[STATE.listen.idx];
  if(item.type === "dialog"){
    var qid = "listen-" + item.data.id;
    STATE.locked[qid] = true;
  } else {
    item.data.questions.forEach(function(_, i){
      STATE.locked["listen-" + item.data.id + "-" + i] = true;
    });
  }
}

function advanceListen(){
  stopSpeech();
  clearListenTimer();
  STATE.listen.idx++;
  STATE.listen.phase = "idle";
  STATE.listen.timeLeft = 0;
  if(STATE.mode === "exam" && STATE.listen.idx < LISTEN_ITEMS.length){
    render();
    setTimeout(function(){ startListenPlay(); }, 900);
  } else {
    render();
  }
}

/* ---------------- ERROR SECTION ---------------- */

function renderErrorSection(){
  var html = '<div class="card"><p class="section-intro"><b>Structure &amp; Written Expression</b> — แตะส่วนที่คิดว่าผิดไวยากรณ์ในแต่ละประโยค</p>';
  html += sectionTimerHtml("error");
  html += "</div>";
  ERRORS.forEach(function(item, idx){
    var qid = "error-" + item.id;
    var locked = !!STATE.locked[qid];
    var selected = STATE.answers[qid];
    html += '<div class="card"><p class="progress-mini">ข้อ ' + (idx+1) + ' / ' + ERRORS.length + '</p><p class="sentence">';
    item.segs.forEach(function(s){
      if(!s.k){ html += esc(s.t); return; }
      var cls = "seg";
      if(selected === s.k && !locked) cls += " selected";
      if(locked){
        if(s.k === item.answer) cls += " correct";
        else if(s.k === selected) cls += " wrong";
      }
      html += '<button type="button" class="' + cls + '" data-action="pick-seg" data-qid="' + qid + '" data-k="' + s.k + '"' + (locked?' disabled':'') + '>' + esc(s.t) + '<sup>' + s.k + '</sup></button>';
    });
    html += "</p>";
    if(locked){
      html += '<div class="explain"><b>' + (selected===item.answer?"ถูกต้อง! ":"ไม่ถูกต้อง — ") + '</b>' + esc(item.explain) + "</div>";
    }
    if(STATE.mode === "practice" && !locked){
      html += '<div class="btnrow"><button class="btn" data-action="submit-one" data-qid="' + qid + '" ' + (selected===undefined?'disabled':'') + '>ตรวจคำตอบ</button></div>';
    }
    html += "</div>";
  });
  html += sectionFooter("error", ERRORS.map(function(e){ return "error-"+e.id; }));
  return html;
}

/* ---------------- CLOZE SECTION ---------------- */

function renderClozeSection(){
  var html = '<div class="card"><p class="section-intro"><b>Cloze Test</b> — อ่านย่อหน้า แล้วเลือกคำที่เหมาะกับช่องว่างแต่ละช่อง</p>';
  html += sectionTimerHtml("cloze");
  html += "</div>";
  CLOZE_PASSAGES.forEach(function(p){
    html += '<div class="card"><h3>' + esc(p.title) + '</h3><div class="passage">';
    var text = p.template.replace(/\{\{(\d+)\}\}/g, function(_, n){ return '<span class="blankmark">(' + n + ')</span>'; });
    html += text + "</div>";
    p.blanks.forEach(function(b){
      var qid = "cloze-" + b.n;
      html += '<div style="margin-top:14px"><p class="qgroup-title">ช่องว่างที่ (' + b.n + ')</p>';
      html += renderMCQ(qid, "", b.choices, b.answer, b.explain, {});
      html += "</div>";
    });
    html += "</div>";
  });
  var allIds = [];
  CLOZE_PASSAGES.forEach(function(p){ p.blanks.forEach(function(b){ allIds.push("cloze-"+b.n); }); });
  html += sectionFooter("cloze", allIds);
  return html;
}

/* ---------------- VOCAB SECTION ---------------- */

function renderVocabSection(){
  var html = '<div class="card"><p class="section-intro"><b>Vocabulary</b> — เลือกคำที่ความหมายใกล้เคียงที่สุด</p>';
  html += sectionTimerHtml("vocab");
  html += "</div>";
  VOCAB.forEach(function(item, idx){
    var qid = "vocab-" + item.id;
    html += '<div class="card"><p class="progress-mini">ข้อ ' + (idx+1) + ' / ' + VOCAB.length + '</p>';
    html += renderMCQ(qid, '<b>' + esc(item.word) + '</b>', item.choices, item.answer, item.explain, {});
    html += "</div>";
  });
  html += sectionFooter("vocab", VOCAB.map(function(v){ return "vocab-"+v.id; }));
  return html;
}

/* ---------------- READING SECTION ---------------- */

function readingFlat(){
  var out = [];
  READING.passages.forEach(function(p){ p.questions.forEach(function(q){ out.push(q); }); });
  return out;
}

function renderReadingSection(){
  var html = '<div class="card"><p class="section-intro"><b>Reading Comprehension</b></p>';
  html += sectionTimerHtml("reading");
  html += "</div>";
  var total = readingFlat().length;
  var idx = 0;
  READING.passages.forEach(function(p){
    html += '<div class="card"><h3>' + esc(p.title) + '</h3><div class="passage">' + esc(p.passage) + '</div></div>';
    p.questions.forEach(function(item){
      var qid = "reading-" + idx;
      html += '<div class="card"><p class="progress-mini">ข้อ ' + (idx+1) + ' / ' + total + '</p>';
      html += renderMCQ(qid, esc(item.q), item.choices, item.answer, item.explain, {});
      html += "</div>";
      idx++;
    });
  });
  html += sectionFooter("reading", readingFlat().map(function(_,i){ return "reading-"+i; }));
  return html;
}

/* ---------------- TIMER + FOOTER HELPERS ---------------- */

function sectionTimerHtml(key){
  if(STATE.mode !== "exam") return "";
  var t = STATE.secTimer[key];
  var urgent = t.left <= 30;
  var submitted = STATE.secSubmitted[key];
  if(submitted) return '<div class="timerbar"><span>ส่งคำตอบแล้ว</span><span class="t mono">หมดเวลา/ส่งแล้ว</span></div>';
  return '<div class="timerbar' + (urgent?" urgent":"") + '"><span>เวลาที่เหลือในส่วนนี้</span><span class="t mono">' + fmtTime(t.left) + '</span></div>';
}

function sectionFooter(key, qids){
  var html = "";
  if(STATE.mode === "exam"){
    var submitted = STATE.secSubmitted[key];
    var answeredCount = qids.filter(function(q){ return STATE.answers[q] !== undefined; }).length;
    if(!submitted){
      html += '<div class="btnrow"><button class="btn" data-action="submit-section" data-section="' + key + '">ส่งคำตอบทั้งหมด (' + answeredCount + '/' + qids.length + ')</button></div>';
    } else {
      var correct = qids.filter(function(q){ return isCorrect(q); }).length;
      html += '<div class="card"><p><b>สรุปส่วนนี้:</b> ทำถูก ' + correct + ' / ' + qids.length + ' ข้อ</p></div>';
    }
  }
  return html;
}

function isCorrect(qid){
  var parts = qid.split("-");
  var section = parts[0];
  if(section === "error"){
    var e = ERRORS.find(function(x){ return "error-"+x.id === qid; });
    return e && STATE.answers[qid] === e.answer;
  }
  if(section === "cloze"){
    var n = parseInt(parts[1],10);
    var b = null;
    CLOZE_PASSAGES.forEach(function(p){ p.blanks.forEach(function(x){ if(x.n===n) b = x; }); });
    return b && STATE.answers[qid] === b.answer;
  }
  if(section === "vocab"){
    var v = VOCAB.find(function(x){ return "vocab-"+x.id === qid; });
    return v && STATE.answers[qid] === v.answer;
  }
  if(section === "reading"){
    var idx = parseInt(parts[1],10);
    var rf = readingFlat();
    return rf[idx] && STATE.answers[qid] === rf[idx].answer;
  }
  return false;
}

/* ---------------- RESULTS ---------------- */

function renderResults(){
  var groups = [
    { key:"listening", label:"Listening", ids: LISTEN_ITEMS.reduce(function(a,it){ if(it.type==="dialog") a.push("listen-"+it.data.id); else it.data.questions.forEach(function(_,i){ a.push("listen-"+it.data.id+"-"+i); }); return a; }, []) },
    { key:"error", label:"Structure", ids: ERRORS.map(function(e){ return "error-"+e.id; }) },
    { key:"cloze", label:"Cloze", ids: (function(){ var a=[]; CLOZE_PASSAGES.forEach(function(p){ p.blanks.forEach(function(b){ a.push("cloze-"+b.n); }); }); return a; })() },
    { key:"vocab", label:"Vocabulary", ids: VOCAB.map(function(v){ return "vocab-"+v.id; }) },
    { key:"reading", label:"Reading", ids: readingFlat().map(function(_,i){ return "reading-"+i; }) }
  ];
  var totalQ = 0, totalCorrect = 0;
  var bars = "";
  groups.forEach(function(g){
    var answered = g.ids.filter(function(id){ return STATE.locked[id] || STATE.answers[id]!==undefined && STATE.secSubmitted[g.key]; });
    var correct = 0;
    g.ids.forEach(function(id){
      var locked = STATE.locked[id] || STATE.secSubmitted[g.key];
      if(g.key === "listening"){ locked = STATE.locked[id]; }
      if(locked && checkAnswerAny(id)) correct++;
    });
    totalQ += g.ids.length;
    totalCorrect += correct;
    var pct = g.ids.length ? Math.round(correct / g.ids.length * 100) : 0;
    bars += '<div class="bar-row"><span>' + g.label + '</span><div class="bar-track"><div class="bar-fill" style="width:' + pct + '%"></div></div><span class="mono">' + correct + '/' + g.ids.length + '</span></div>';
  });

  var html = '<div class="card score-hero"><div class="big">' + totalCorrect + ' <span>/ ' + totalQ + '</span></div><p class="section-intro">คะแนนรวมทุกส่วน (นับเฉพาะข้อที่ตรวจ/ส่งแล้ว)</p></div>';
  html += '<div class="card"><div class="bars">' + bars + '</div></div>';
  html += '<div class="card"><div class="btnrow"><button class="btn" data-action="reset-all">เริ่มทำใหม่ทั้งหมด</button></div></div>';
  return html;
}

function checkAnswerAny(qid){
  if(qid.indexOf("listen-") === 0){
    var rest = qid.slice(7);
    var d = DIALOGS.find(function(x){ return x.id === rest; });
    if(d) return STATE.answers[qid] === d.answer;
    var lastDash = rest.lastIndexOf("-");
    var mid = rest.slice(0, lastDash), qi = parseInt(rest.slice(lastDash+1),10);
    var m = MONOLOGS.find(function(x){ return x.id === mid; });
    if(m) return STATE.answers[qid] === m.questions[qi].answer;
    return false;
  }
  return isCorrect(qid);
}

/* ---------------- MAIN RENDER ---------------- */

function render(){
  var setSwitch = document.getElementById("setSwitch");
  setSwitch.innerHTML = EXAM_SETS.map(function(s, i){
    return '<button data-action="switch-set" data-idx="' + i + '" class="' + (STATE.setIndex===i?"active":"") + '">' + esc(s.label) + "</button>";
  }).join("");

  var tabs = document.getElementById("tabs");
  tabs.innerHTML = SECTION_DEFS.map(function(s){
    return '<button data-action="goto-section" data-section="' + s.key + '" class="' + (STATE.section===s.key?"active":"") + '">' + s.label + "</button>";
  }).join("");

  var modeToggle = document.getElementById("modeToggle");
  Array.prototype.forEach.call(modeToggle.querySelectorAll("button"), function(b){
    b.classList.toggle("active", b.getAttribute("data-mode")===STATE.mode);
  });

  var stage = document.getElementById("stage");
  if(STATE.section === "listening") stage.innerHTML = renderListening();
  else if(STATE.section === "error") stage.innerHTML = renderErrorSection();
  else if(STATE.section === "cloze") stage.innerHTML = renderClozeSection();
  else if(STATE.section === "vocab") stage.innerHTML = renderVocabSection();
  else if(STATE.section === "reading") stage.innerHTML = renderReadingSection();
  else if(STATE.section === "results") stage.innerHTML = renderResults();
}

/* ---------------- SECTION TIMER CONTROL ---------------- */

function ensureSectionTimer(key){
  var def = SECTION_DEFS.find(function(s){ return s.key===key; });
  if(!def || !def.time) return;
  var t = STATE.secTimer[key];
  if(STATE.mode !== "exam" || STATE.secSubmitted[key]){
    if(t.id){ clearInterval(t.id); t.id = null; t.running = false; }
    return;
  }
  if(t.running) return;
  t.running = true;
  t.id = setInterval(function(){
    t.left--;
    if(t.left <= 0){
      clearInterval(t.id); t.id = null; t.running = false;
      submitSection(key);
      return;
    }
    if(STATE.section === key) render();
  }, 1000);
}
function stopAllSectionTimers(){
  Object.keys(STATE.secTimer).forEach(function(k){
    var t = STATE.secTimer[k];
    if(t.id){ clearInterval(t.id); t.id = null; }
    t.running = false;
  });
}
function submitSection(key){
  STATE.secSubmitted[key] = true;
  var t = STATE.secTimer[key];
  if(t && t.id){ clearInterval(t.id); t.id = null; t.running = false; }
  var idsMap = { error: ERRORS.map(function(e){return "error-"+e.id;}),
    cloze: (function(){ var a=[]; CLOZE_PASSAGES.forEach(function(p){p.blanks.forEach(function(b){a.push("cloze-"+b.n);});}); return a; })(),
    vocab: VOCAB.map(function(v){return "vocab-"+v.id;}),
    reading: readingFlat().map(function(_,i){return "reading-"+i;}) };
  (idsMap[key]||[]).forEach(function(id){ STATE.locked[id] = true; });
  render();
}

/* ---------------- EVENTS ---------------- */

document.getElementById("modeToggle").addEventListener("click", function(e){
  var btn = e.target.closest("button[data-mode]");
  if(!btn) return;
  STATE.mode = btn.getAttribute("data-mode");
  stopSpeech(); clearListenTimer(); stopAllSectionTimers();
  STATE.listen = { idx:0, phase:"idle", timerId:null, timeLeft:0 };
  render();
});

document.addEventListener("click", function(e){
  var t = e.target.closest("[data-action]");
  if(!t) return;
  var action = t.getAttribute("data-action");

  if(action === "goto-section"){
    stopSpeech(); clearListenTimer();
    STATE.section = t.getAttribute("data-section");
    if(["error","cloze","vocab","reading"].indexOf(STATE.section) !== -1) ensureSectionTimer(STATE.section);
    render();
    return;
  }

  if(action === "pick"){
    var qid = t.getAttribute("data-qid");
    if(STATE.locked[qid]) return;
    STATE.answers[qid] = parseInt(t.getAttribute("data-idx"),10);
    if(STATE.mode === "exam"){
      // exam mode: selection recorded silently, no reveal
    }
    render();
    return;
  }

  if(action === "pick-seg"){
    var qid2 = t.getAttribute("data-qid");
    if(STATE.locked[qid2]) return;
    STATE.answers[qid2] = t.getAttribute("data-k");
    render();
    return;
  }

  if(action === "submit-one"){
    var qid3 = t.getAttribute("data-qid");
    if(STATE.answers[qid3] === undefined) return;
    STATE.locked[qid3] = true;
    render();
    return;
  }

  if(action === "submit-section"){
    var key = t.getAttribute("data-section");
    submitSection(key);
    return;
  }

  if(action === "toggle-transcript"){
    var tid = t.getAttribute("data-tid");
    STATE.showTranscript[tid] = !STATE.showTranscript[tid];
    render();
    return;
  }

  if(action === "listen-play"){
    startListenPlay();
    return;
  }

  if(action === "listen-replay"){
    var item = LISTEN_ITEMS[STATE.listen.idx];
    STATE.listen.phase = "playing";
    render();
    speakLines(item.data.lines, function(){
      STATE.listen.phase = "answering";
      render();
    });
    return;
  }

  if(action === "listen-next"){
    advanceListen();
    return;
  }

  if(action === "listen-restart"){
    stopSpeech(); clearListenTimer();
    STATE.listen = { idx:0, phase:"idle", timerId:null, timeLeft:0 };
    LISTEN_ITEMS.forEach(function(it){
      if(it.type==="dialog"){ delete STATE.locked["listen-"+it.data.id]; delete STATE.answers["listen-"+it.data.id]; }
      else it.data.questions.forEach(function(_,i){ delete STATE.locked["listen-"+it.data.id+"-"+i]; delete STATE.answers["listen-"+it.data.id+"-"+i]; });
    });
    render();
    return;
  }

  if(action === "switch-set"){
    var newIdx = parseInt(t.getAttribute("data-idx"),10);
    stopSpeech(); clearListenTimer(); stopAllSectionTimers();
    loadSet(newIdx);
    STATE.setIndex = newIdx;
    STATE.answers = {}; STATE.locked = {}; STATE.showTranscript = {};
    STATE.listen = { idx:0, phase:"idle", timerId:null, timeLeft:0 };
    STATE.secTimer = { error:{running:false,left:1200,id:null}, cloze:{running:false,left:1200,id:null}, vocab:{running:false,left:1200,id:null}, reading:{running:false,left:2700,id:null} };
    STATE.secSubmitted = { error:false, cloze:false, vocab:false, reading:false };
    STATE.section = "listening";
    render();
    return;
  }

  if(action === "reset-all"){
    stopSpeech(); clearListenTimer(); stopAllSectionTimers();
    STATE.answers = {}; STATE.locked = {}; STATE.showTranscript = {};
    STATE.listen = { idx:0, phase:"idle", timerId:null, timeLeft:0 };
    STATE.secTimer = { error:{running:false,left:1200,id:null}, cloze:{running:false,left:1200,id:null}, vocab:{running:false,left:1200,id:null}, reading:{running:false,left:2700,id:null} };
    STATE.secSubmitted = { error:false, cloze:false, vocab:false, reading:false };
    STATE.section = "listening";
    render();
    return;
  }
});

render();
})();
</script>
